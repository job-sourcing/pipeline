name: remote-scrape
# Generic remote compute job: runs on a GitHub-hosted ubuntu runner (Azure IP) and
# fetches one or more target URLs using curl / curl_cffi-impersonate / system Chrome.
# Each matrix job is a separate VM => a distinct Azure IP. Dispatch via `bin/wgha`.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'JSON array of target URLs, e.g. ["https://ipinfo.io/json"]'
        required: true
        default: '["https://ipinfo.io/json"]'
      mode:
        description: 'curl | impersonate | browser'
        required: false
        default: 'impersonate'
      wait_ms:
        description: 'Browser/JS virtual-time budget (ms)'
        required: false
        default: '4000'
      timeout_s:
        description: 'Per-URL timeout (s)'
        required: false
        default: '30'
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJSON(inputs.urls) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet curl_cffi requests
      - name: Runner egress identity
        run: |
          set -x
          mkdir -p out
          curl -s --max-time 15 https://ipinfo.io/json -o out/runner-ip.json || true
          curl -s --max-time 15 https://tls.peet.ws/api/all -o out/runner-tls.json || true
          python - <<'PY'
          import json
          try:
              print("RUNNER IP:", json.load(open("out/runner-ip.json")).get("ip"))
          except Exception as e: print("ip parse failed:", e)
          try:
              t=json.load(open("out/runner-tls.json"))
              print("JA3 hash:", t.get("tls",{}).get("ja3_hash"))
              print("JA4:", t.get("tls",{}).get("ja4"))
              print("HTTP2 fp:", t.get("http2",{}).get("akamai_fingerprint"))
          except Exception as e: print("tls parse failed:", e)
          PY
      - name: Scrape target
        env:
          TARGET_URL: ${{ matrix.url }}
          MODE: ${{ inputs.mode }}
          WAIT_MS: ${{ inputs.wait_ms }}
          TIMEOUT_S: ${{ inputs.timeout_s }}
        run: python scripts/gha_fetch.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ strategy.job-index }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

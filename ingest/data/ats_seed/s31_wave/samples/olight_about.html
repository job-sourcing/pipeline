com/images/contactUs/vision-3.jpg" alt="Slide 3"/></div></div></div></div></div></div><div class="mui-style-1lacnn4 e1e6sztc6"><div class="container"><h2 class="animatedHeading">Fast<!-- --> <span>Facts</span></h2><div class="mui-style-w1299h e1e6sztc8"><div class="mui-style-idf254 e1e6sztc9"><div class="title">Attracts</div><div class="title">20M+</div><div class="title">Users</div></div><div class="mui-style-awq8tr e1e6sztc9"><div class="title">Holds</div><div class="title">1200+</div><div class="title">Patents</div></div><div class="mui-style-awq8tr e1e6sztc9"><div class="title">Obtains</div><div class="title">600+</div><div class="title">Certifications</div></div><div class="mui-style-awq8tr e1e6sztc9"><div class="title">Reaches</div><div class="title">100+</div><div class="title">Countries &amp; Regions</div></div><div class="mui-style-awq8tr e1e6sztc9"><div class="title">Over</div><div class="title">18</div><div class="title">Years Innovation</div></div></div><div class="mui-style-3vl1mm e1e6sztc7"><div class="swiper"><div class="swiper-wrapper"><div class="swiper-slide"><div class="swiper-banner"><img class="img-responsive" src="https://cdn.olightstore.com/images/contactUs/fast-1.jpg" alt="Slide 1"/><div class="slide-caption"><p>Share, Create, Grow Together</p><p>Olight proudly serves a global community of over 20 million users, from outdoor adventurers and tactical professionals to everyday users who demand reliable lighting. We always put our fans and customers first, offering lifetime warranty in key markets and 24/7 customer service. </p></div></div></div><div class="swiper-slide"><div class="swiper-banner"><img class="img-responsive" src="https://cdn.olightstore.com/images/contactUs/fast-2.png" alt="Slide 2"/><div class="slide-caption"><p>Innovation Protected by 1200+ Patents</p><p>At Olight, innovation is more than an ideal—it’s a deliverable. Through relentless pursuit of innovation, we hold over 1,200 patents, and have won prestigious international design awards.  These patents ensure we stay ahead of the curve while offering our users cutting-edge olight flashlights that are safe, efficient, and built to last.</p></div></div></div><div class="swiper-slide"><div class="swiper-banner"><img class="img-responsive" src="https://cdn.olightstore.com/images/contactUs/fast-3.png" alt="Slide 3"/><div class="slide-caption"><p>Certified for Confidence: 600+ Global Approvals</p><p>Olight products undergo rigorous testing and meet over 600 international certifications. Whether used in extreme conditions or everyday tasks, our lights are trusted worldwide for their proven safety, durability, and environmental responsibility.</p></div></div></div><div class="swiper-slide"><div class="swiper-banner"><img class="img-responsive" src="https://cdn.olightstore.com/image/pc-657x409-dt-8g7kcg.jpg" alt="Slide 4"/><div class="slide-caption"><p>Global Reach, Local Touch</p><p>From North America to Europe, Asia to Oceania, Olight’s presence now spans over 100 countries and regions. This global reach is powered by our strategic partnerships, local engagement, and a unified mission: to deliver high-performance lighting solutions tailored to the needs of diverse users across the world.</p></div></div></div><div class="swiper-slide"><div class="swiper-banner"><img class="img-responsive" src="https://cdn.olightstore.com/images/contactUs/fast-5.jpg" alt="Slide 5"/><div class="slide-caption"><p>18+ Years of Relentless Innovation</p><p>Founded in 2007, Olight has been the global leader in portable lighting. Our journey has been driven by a relentless pursuit of innovation, uncompromising quality, and a passion for empowering people through light—every step of the way.</p></div></div></div></div></div></div></div></div><div class="mui-style-147lyqb e1e6sztc10"><div class="container-swiper"><h2 class="animatedHeading"><span>Pioneer</span> <!-- -->in Portable Lighting Industry</h2><div class="list-box"><div class="swiper"><div class="swiper-wrapper" ></div><p>Launched the SR90, the wolrd's first single-LED flashlight with a 2000-lumen output</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2012</p></div><p>Launched the SR95s UT, setting a new standard with a 1,000-meter beam distance</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2015</p></div><p>Launched the PL-1, Olight's first rail-mounted light</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2017</p></div><p>Constructed an independent large production base</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2019</p></div><p>Held our first OFan Day festival in the United States</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2022</p></div><p>Became the first brand in China's outdoor portable lighting industry to receive CNAS Laboratory accreditation</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2025</p></div><p>Launched the ArkPro series, featured in SlashGear, CNET, and The Guardian<br/><span>Amazon Best-Selling Product</span><br/><span>The Industry's First Dual-Tone Flashlight</span></p></div></div><div class="mui-style-6wwfxu e1e6sztc12"><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2008</p></div><p>Launched the M20s, the industry's first flashlight with a dual tail switch for instant strobe access</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2011</p></div><p>Launched the S80, the first unibody illumination tool in the industry</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2014</p></div><p>Launched the S10R, the first magnetic rechargeable flashlight in the Baton series</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2016</p></div><p>Established Olight USA</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2018</p></div><p>Launched the Warrior X to mark a decade of innovation in tactical lighting</p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2020</p></div><p><span> Launched the Odin series, a brand-new professional rifle light.</span><br/><span>Contributed $1,375,400 USD to support OFan across 11 countries during the global pandemic.</span></p></div><div class="schedule-box mui-style-1b9dfsz e1e6sztc13" style="transition-delay:0s"><div class="num-head"><img src="https://cdn.olightstore.com/images/contactUs/about-icon.svg"/><p>2024</p></div><p>Opened the world's first flashlight experience store in Las Vegas</p></div></div></div></div><div class="module-6-wrapper mui-style-172lvyh e1e6sztc14"><div class="container"><div class="animatedHeading"><h2>Strong Smart Warehousing Network</h2></div><p>Olight&#x27;s warehouses in China, the U.S., Australia, Germany, and France ensure fast and reliable global delivery.</p><div class="beyond-box"><div class="lft"><img src="https://cdn.olightstore.com/image/va-l5dtwx.jpg"/></div><div class="rgt"><img src="https://cdn.olightstore.com/image/za-cf1elo.jpg"/></div></div></div></div><div class="mui-style-172lvyh e1e6sztc14"><div class="container"><h2 class="animatedHeading">Light Up <span>Lives</span> Beyond Illumination</h2><div class="beyond-box"><div class="lft"><img src="https://cdn.olightstore.com/images/contactUs/per-photo.jpg"/></div><div class="rgt"><p>We Believe No One Should be Left in the Dark</p><p>Over $4,000,000 in donations, committed to charity since 2008—18 years of dedication to <a href="https://www.olight.com/social-responsibility">social responsibility.</a></p></div></div></div></div><div class="mui-style-j2k64j e1e6sztc15"><div class="container"><h2 class="animatedHeading">Explore. Connect. Engage with Olight</h2><div class="list"><div class="list-mould"><div class="list-mould-box"><img src="https://cdn.olightstore.com/images/contactUs/emial-icon.svg"/><p>General Inquiries</p></div><a href="mailto:cs.us@olight.com">cs.us@olight.com &gt;</a></div><div class="list-mould"><div class="list-mould-box"><img src="https://cdn.olightstore.com/images/contactUs/emial-icon.svg"/><p>Media &amp; Partnership</p></div><a href="mailto:pr@olight.com">pr@olight.com &gt;</a></div><div class="list-mould"><div class="list-mould-box"><img src="https://cdn.olightstore.com/images/contactUs/frame-icon.svg"/><p>Local Office</p></div><p class="title">7951 Angleton Ct. STE B, Lorton,VA, United States 22079</p></div></div></div></div></div></div><!--$!--><template data-dgst="DYNAMIC_SERVER_USAGE"></template><!--/$--></div></div><!--$!--><template data-dgst="DYNAMIC_SERVER_USAGE"></template><!--/$--><

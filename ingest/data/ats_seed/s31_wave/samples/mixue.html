    <!-- hreflang cluster — the MIXUE Americas country sites.

         What this actually declares: "this page and the pages below are the
         same franchise-recruitment content for different markets; serve each
         visitor the one matching their language/country." It is NOT a
         backlink and carries no ranking weight of its own — self-owned sites
         linking to each other is not third-party endorsement. What it does
         buy is entity consolidation: Google treats mixueusfranchise /
         mixuemexico / mixuebrasil as one brand cluster instead of three
         unrelated domains competing for "mixue".

         ⚠️ hreflang IS ONLY HONOURED WHEN IT IS RECIPROCAL. Google verifies
         the return tag: if www.mixuemexico.com does not carry a matching
         `hreflang="en-us"` pointing back here, this es-mx line is silently
         ignored — no penalty, no benefit. The Mexico and Brazil teams have to
         add their side. Until they do, these two lines are inert.

         ⚠️ The href must be each site's OWN canonical URL, exactly (scheme,
         www, trailing slash). The forms below match the ones already
         published in client/public/llms.txt. If either country site
         canonicalises differently, that line is also ignored.

         This block is REWRITTEN PER ROUTE by scripts/inject-seo-head.mjs:
         only the homepage claims a foreign-language equivalent, because only
         the homepages are equivalent pages. /faq has no Spanish twin, so its
         generated head gets a self-referencing cluster instead. -->
    <link rel="alternate" hreflang="en" href="https://join.mixueusfranchise.com" />
    <link rel="alternate" hreflang="en-us" href="https://join.mixueusfranchise.com" />
    <link rel="alternate" hreflang="es-mx" href="https://www.mixuemexico.com" />
    <link rel="alternate" hreflang="pt-br" href="https://www.mixuebrasil.com.br" />
    <link rel="alternate" hreflang="x-default" href="https://join.mixueusfranchise.com" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CSY1SFVSV8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      /* Google Consent Mode v2 DEFAULT STATE — must run before any `config`.
         Without it the Google tag behaves as granted-by-default and sets
         cookies before the visitor has answered the banner, which defeats the
         `consent update` calls CookieConsent.tsx already makes and is the real
         exposure once advertising conversion tracking is on the page.

         Everything starts denied. CookieConsent.tsx (enableAnalytics /
         enableMarketing) and DoNotSell.tsx flip these to 'granted' the moment
         the visitor affirmatively chooses. wait_for_update gives that stored
         choice a moment to be replayed on a fresh page load before the tag
         decides how to behave. */
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });

      gtag('js', new Date());
      gtag('config', 'G-CSY1SFVSV8');
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    
    <!-- ============================================================
         JSON-LD Structured Data
         
         Schema types used:
         1. Organization       — brand identity, sameAs social links, makesOffer
         2. WebSite            — enables sitelinks search box in Google
         3. BreadcrumbList     — page hierarchy for search result display
         ============================================================ -->

    <!-- 1. Organization Schema: brand identity

         `parentOrganization` is modelled as its own node rather than folded
         into `sameAs`, because `sameAs` means "this URL identifies THE SAME
         entity" — and SNOW KING (US) CORPORATION is a distinct legal entity
         from the listed parent. Claiming otherwise would be a false statement
         in structured data, on a page that also carries FTC franchise
         disclosures.

         It is also what associates this site with the other MIXUE country
         sites (mixuemexico.com, mixuebrasil.com.br) without asserting
         anything untrue about them: separate legal entities under one group,
         so the relationship runs through the shared parent — never as a
         direct sibling identity claim.

         `legalName` on that node is the parent's registered corporate name
         per docs/FACTS_AND_GUARDRAILS.md — a registry reference only, never
         reusable as user-facing product copy (FDA "ice cream" red line). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://join.mixueusfranchise.com/#organization",
      "name": "MIXUE USA",
      "legalName": "SNOW KING (US) CORPORATION",
      "description": "MIXUE — the world's largest freshly-made drinks brand by store count. Official USA franchise opportunities with 49,000+ stores across 14+ countries since 1997.",
      "url": "https://join.mixueusfranchise.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://join.mixueusfranchise.com/images/logo.svg",
        "width": 200,
        "height": 60
      },
      "image": "https://join.mixueusfranchise.com/og-image.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "8484 Wilshire Blvd, Suite 730",
        "addressLocality": "Los Angeles",
        "addressRegion": "CA",
        "postalCode": "90211",
        "addressCountry": "US"
      },
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "foundingDate": "1997",
      "parentOrganization": {
        "@type": "Organization",
        "name": "MIXUE Group",
        "legalName": "MIXUE Ice Cream & Tea",
        "url": "https://mxbc.com",
        "sameAs": "https://en.wikipedia.org/wiki/Mixue_Ice_Cream_%26_Tea"
      },
      "sameAs": [
        "https://en.wikipedia.org/wiki/Mixue_Ice_Cream_%26_Tea",
        "https://www.instagram.com/mixue_global/",
        "https://www.linkedin.com/company/%E8%9C%9C%E9%9B%AA%E5%86%B0%E5%9F%8E%E8%82%A1%E4%BB%BD%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/",
        "https://mxbc.com"
      ],
      "makesOffer": {
        "@type": "Offer",
        "name": "MIXUE Franchise License",
        "description": "MIXUE USA franchise license. Annual franchise fee $10,000, royalty rate 2% per the current FDD.",
        "priceSpecification": {
          "@type": "PriceSpecification",
          "minPrice": 271813,
          "maxPrice": 843055,
          "priceCurrency": "USD"
        },
        "potentialAction": {
          "@type": "ApplyAction",
          "name": "Apply for MIXUE Franchise",
          "target": "https://join.mixueamericas.com/apply?country=US&amp;utm_source=mixue_us_site"
        }
      }
    }
    </script>

name: Role Sweep DMM (weekly)

# S41 stress test #1 (DESIGN-S41 v2 §2): the digital-marketing demand-
# side family through the STANDARDIZED family engine — same sweep
# machinery, same 14 reachable sources, same sector grades, same
# checkpoint SOP. The F9 locked endpoints (talent/muse/wwr/yc/hn/
# himalayas + the PM-only l0 bundle) are skipped and recorded in the
# envelope as locked_endpoints — an honest 0, never a silent 0.
#
# Cadence: weekly Wed 13:00Z (after the PM sweep's 12:00 slot lands;
# independent concurrency group — parallel runners by design). The
# family-registry queries: 10 core + 10 tail (monthly --full mode via
# dispatch input). Runtime ≈ the PM sweep minus the locked sources:
# ~15-20 min. timeout 60 (adzuna 20 queries × 10pg + jobspy 20q100).
#
# Artifacts (file-level checkpoint — the F7 doctrine): dmm_inventory
# .csv / dmm_dropped.csv / dmm_envelope.json / dmm_coverage.json +
# ui/roles-dmm.json + the roles:dmm drift ledger entry. Mirror: the
# F15 per-family back-sync handlers ship in the same change.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "core + tail queries (the monthly mode, on demand)"
        type: boolean
        default: false
  schedule:
    - cron: "0 13 * * 3"    # Wednesdays 13:00Z

permissions:
  contents: write
  actions: write

concurrency:
  group: role-sweep-dmm
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline + jobspy extra
        run: pip install -e "ingest[jobspy]" curl_cffi

      - name: Run role sweep (family dmm)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          CAREERJET_REFERER: ${{ secrets.CAREERJET_REFERER }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          FULL_SWEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          set -e
          ARGS="--family dmm"
          if [ "$FULL_SWEEP" = "true" ]; then ARGS="$ARGS --full"; fi
          # the family seed: unions the PRIOR dmm envelope (run 1 has
          # none — sweep records ok:skipped per F17); pm's roles-pm
          # union is deliberately NOT consulted (family isolation)
          python3 scripts/role_sweep.py $ARGS \
            --seed-envelope ingest/data/ui/roles-dmm.json

      - name: Drift audit (rides the same lane — roles:* glob)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_REPO: job-sourcing/pipeline
        run: python3 scripts/drift_alert.py || true

      - name: Checkpoint artifacts to git (race-proof, file-level — F7)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/sweep_state
          PATHS="ingest/data/roles/dmm_inventory.csv ingest/data/roles/dmm_dropped.csv ingest/data/roles/dmm_envelope.json ingest/data/roles/dmm_coverage.json ingest/data/ui/roles-dmm.json ingest/data/board_watch/roles:dmm.runs.jsonl ingest/data/board_watch/drift_baseline.json"
          for p in $PATHS; do
            if [ -e "$p" ]; then
              mkdir -p "/tmp/sweep_state/$(dirname $p)"
              cp -r "$p" "/tmp/sweep_state/$p" 2>/dev/null || true
            fi
          done
          git config user.name "role-sweep-bot"
          git config user.email "actions@github.com"
          push_ok=0
          for i in 1 2 3; do
            git fetch origin || true
            git reset --hard origin/main
            for p in $PATHS; do
              if [ -e "/tmp/sweep_state/$p" ]; then
                cp "/tmp/sweep_state/$p" "$p"
              fi
            done
            # F7 lesson: existence-guarded add — a pathspec for a
            # file that legitimately does not exist on run 1 exits 128
            # under set -e and kills the checkpoint
            for f in ingest/data/roles/dmm_inventory.csv ingest/data/roles/dmm_dropped.csv ingest/data/roles/dmm_envelope.json ingest/data/roles/dmm_coverage.json ingest/data/ui/roles-dmm.json "ingest/data/board_watch/roles:dmm.runs.jsonl" ingest/data/board_watch/drift_baseline.json; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              push_ok=1; break
            fi
            git commit -m "role-sweep-dmm checkpoint [skip ci]"
            if git push; then push_ok=1; break; fi
            sleep 5
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::role-sweep-dmm checkpoint push failed after 3 attempts — state rescued in /tmp"
            exit 1
          fi

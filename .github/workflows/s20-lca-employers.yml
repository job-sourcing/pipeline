name: S20 LCA employer universe

# S20 census instrument (B-axis): download the FULL quarterly LCA
# disclosure file and commit the unique-employer aggregation.
#
# WHY HERE: egress matrix (measured S11 + S19) — HK sandbox direct →
# Akamai 403; supabase proxy → 200 but truncated at ~10.5MB (the real
# quarterly file is larger → BadZipFile even though PK magic looks
# right); GHA runner (Azure US) → full file. Same transport story as
# h1b-extract.yml, but this extracts the FULL employer universe (not
# just the watch roster's employers).
#
# Output: ingest/data/ats_seed/s20_census/lca_employers_fy2026_q3.json
# (checkpoint-committed; the private archive back-syncs it via the
# mirror script's s20_census back-sync step).
#
# Cadence: workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "FYxxxx_Qn (empty = FY2026_Q3)"
        default: "FY2026_Q3"

permissions:
  contents: write

concurrency:
  group: s20-lca-employers
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install --quiet requests openpyxl

      - name: Download LCA disclosure file
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          Q="${QUARTER:-FY2026_Q3}"
          mkdir -p ingest/data/ats_seed/s20_census
          python3 - << EOF
          import requests, sys
          q = "${Q}"
          bases = [
              "https://www.dol.gov/sites/dolgov/files/ETA/oflc/pdfs",
              "https://www.dol.gov/media",
          ]
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) "
                "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0"}
          last = None
          for base in bases:
              url = f"{base}/LCA_Disclosure_Data_{q}.xlsx"
              for attempt in range(3):
                  try:
                      r = requests.get(url, headers=ua, timeout=600, stream=True)
                      print(f"{url} -> {r.status_code}")
                      if r.status_code == 200:
                          body = r.content
                          if len(body) > 1_000_000:
                              open(f"lca_{q}.xlsx", "wb").write(body)
                              print(f"saved {len(body)} bytes")
                              sys.exit(0)
                          last = f"tiny body {len(body)} bytes from {url}"
                      else:
                          last = f"{r.status_code} from {url}"
                  except Exception as e:
                      last = f"{type(e).__name__}: {e} from {url}"
                  print("retry", attempt + 1, last)
          print(f"::error::LCA download failed: {last}")
          sys.exit(1)
          EOF
          python3 -c "import zipfile; zipfile.ZipFile('lca_${Q}.xlsx').namelist(); print('zip OK')" || { echo '::error::not a valid zip (truncated?)'; exit 1; }

      - name: Aggregate employer universe
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          Q="${QUARTER:-FY2026_Q3}"
          python3 scripts/s20_lca_employers.py "lca_${Q}.xlsx" \
            "ingest/data/ats_seed/s20_census/lca_employers_${Q,,}.json"

      - name: Commit checkpoint
        run: |
          git config user.name "s20-lca-bot"
          git config user.email "s20-lca-bot@users.noreply.github.com"
          git add ingest/data/ats_seed/s20_census/lca_employers_*.json
          if git diff --cached --quiet; then
            echo "no changes (already committed)"
          else
            git commit -m "s20 LCA employer universe checkpoint (Q:${{ inputs.quarter || 'FY2026_Q3' }})"
            git push origin main
          fi

name: Role Sweep PM (weekly)

# S36 (D-S36-1, DESIGN-S36 v2.1) → S38 (DESIGN-S38 v2 — the
# exhaustive-completion round): the role-keyed PM sweep lane. Layers:
# L0 bundle + L1.5 keyed volume (findwork full-JD / Adzuna
# relevance+45d 10pg / Jooble 5pg / Dice flight-JSON / Careerjet v4
# quoted-phrase / jobspy-Indeed 7q×100) + L1 LinkedIn-guest keyword
# (Azure egress, 429 ladder) + L2 keyless closure (WWR/trio/talent)
# + the STARTUP layer (yc workatastartup + ycombinator + city pages /
# wellfound feed / hn who-is-hiring — the S38 directive: NO aggregator
# covers the startup dirs, scrape the source) + The Muse + USAJOBS
# (US-geo: keyless/keyed, HK-403 Azure-live) + L3 Google-Jobs role
# queries (firecrawl credits, preflight < 200, transport-retry ×3).
# Outputs the roles/ envelope + roles:pm drift ledger +
# ui/roles-pm.json (the S35 new-artifact triple rule: rescue globs
# here + mirror back-sync + these git-add pathspecs). --full on the
# 1st (core + tail, tail queries capped 3 pages — F16).
# Runtime ~15-25 min typical weekly, worst ~50 (S38 F5 arithmetic:
# adzuna 70 req, dice 56, careerjet 35, li ladder worst 23min, gj
# retries worst 10min). timeout-minutes: 90.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "core + tail queries (the monthly mode, on demand)"
        type: boolean
        default: false
  schedule:
    # S41 fleet cadence: DAILY lite sweeps (fresh postings enter the
    # envelope within 1 day instead of up to 7 — the "queue moves slow /
    # cross-day unacceptable" directive). Lite = --skip gj,builtin: the
    # two firecrawl credit-burners (gj 7-21/run, builtin ~12/run) stay
    # WEEKLY-only so the ~1,000-credit budget holds; everything else
    # burns zero credits on the US Azure runner.
    - cron: "0 12 * * 0-2,4-6"   # daily lite (NOT Wed)
    - cron: "0 12 * * 3"    # Wed 12:00Z: full incl. gj + builtin (weekly L3)
    - cron: "0 12 1 * *"    # 1st of month: --full (core + tail queries)

permissions:
  contents: write
  actions: write

concurrency:
  group: role-sweep-pm
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline + jobspy extra
        run: pip install -e "ingest[jobspy]" curl_cffi

      - name: Run role sweep
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          CAREERJET_REFERER: ${{ secrets.CAREERJET_REFERER }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          FULL_SWEEP: ${{ github.event.schedule == '0 12 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
          DAILY_LITE: ${{ github.event.schedule == '0 12 * * 0-2,4-6' }}
        run: |
          set -e
          ARGS=""
          if [ "$FULL_SWEEP" = "true" ]; then ARGS="--full"; fi
          if [ "$DAILY_LITE" = "true" ]; then ARGS="$ARGS --skip gj,builtin"; fi
          # S39 §A5/F13: the seed-envelope union — careerjet is HK-only
          # (403 on Azure; firecrawl relay measured BROKEN), so the lane
          # unions the archive's latest envelope to carry its rows.
          # Runtime +8-12min (seed re-gate ~3k rows) — inside the 90min
          # budget. USAJOBS falls back to the firecrawl relay (~12
          # credits); builtin ~12; gj 7-21 (retry ladder).
          python3 scripts/role_sweep.py $ARGS \
            --seed-envelope ingest/data/ui/roles-pm.json

      - name: Drift audit (sweep-mode rides the same lane)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_REPO: job-sourcing/pipeline
        run: python3 scripts/drift_alert.py || true

      - name: Checkpoint artifacts to git (race-proof, triple-rule globs)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/sweep_state
          PATHS="ingest/data/roles ingest/data/ui/roles-pm.json ingest/data/board_watch/roles:pm.runs.jsonl ingest/data/board_watch/drift_baseline.json"
          for p in $PATHS; do
            if [ -e "$p" ]; then
              mkdir -p "/tmp/sweep_state/$(dirname $p)"
              cp -r "$p" "/tmp/sweep_state/$p" 2>/dev/null || true
            fi
          done
          git config user.name "role-sweep-bot"
          git config user.email "actions@github.com"
          push_ok=0
          for i in 1 2 3; do
            git fetch origin || true
            git reset --hard origin/main
            for p in $PATHS; do
              if [ -e "/tmp/sweep_state/$p" ]; then
                # S40 fix: rm-then-cp. A plain `cp -r src dst` when dst is an
                # existing DIRECTORY copies src INTO dst (dst/src) — this is
                # what grew ingest/data/roles/roles/roles/... +1 level per
                # lane run (observed 4 levels after lane #5). Files are
                # unaffected (cp overwrites); only the dir path trips it.
                rm -rf "$p"
                mkdir -p "$(dirname $p)"
                cp -r "/tmp/sweep_state/$p" "$p"
              fi
            done
            git add ingest/data/roles ingest/data/ui/roles-pm.json "ingest/data/board_watch/roles:pm.runs.jsonl" ingest/data/board_watch/drift_baseline.json
            if git diff --cached --quiet; then
              push_ok=1; break
            fi
            git commit -m "role-sweep-pm checkpoint [skip ci]"
            if git push; then push_ok=1; break; fi
            sleep 5
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::role-sweep checkpoint push failed after 3 attempts"
            exit 1
          fi

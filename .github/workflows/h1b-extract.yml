name: H-1B LCA extract

# Quarterly DOL H-1B / LCA extract (S11, design S8-F-3): downloads the
# quarterly LCA disclosure xlsx files from dol.gov and commits the
# NVIDIA-only extract ({label}.h1b_lca.jsonl) that board_dump's finish
# phase joins into the CSV wage-band columns (v2.6).
#
# WHY THIS RUNS HERE (egress matrix, measured 2026-09-17):
#   HK sandbox direct → 403 Akamai geo-block
#   Netlify US function → 403 Akamai (fetch engine, plain GET too)
#   Supabase Deno proxy → 200 but TRUNCATED at ~10.5MB (the files are
#     larger; a 200-with-truncated-body trap)
#   GHA runner (Azure US) → the one egress expected to serve the full
#     files — this workflow IS the transport.
#
# Cadence: workflow_dispatch ONLY (the LCA files publish quarterly;
# no cron to burn minutes). Free unlimited minutes on this public repo.
# The extract is the checkpoint (case-number-deduped, append-only) —
# re-dispatching with the same quarters is a no-op.

on:
  workflow_dispatch:
    inputs:
      quarters:
        description: "FYxxxx_Qn comma list (empty = use recent)"
        default: ""
      recent:
        description: "N most recently published quarters"
        default: "6"

permissions:
  contents: write

concurrency:
  group: h1b-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize ingest/.env from secret
        # Needed for SUPABASE_PROXY_* (the quarter-listing path + the
        # last-resort transport). The public repo never commits it.
        env:
          INGEST_ENV: ${{ secrets.INGEST_ENV }}
        run: |
          if [ -n "$INGEST_ENV" ]; then
            printf '%s\n' "$INGEST_ENV" > ingest/.env
            echo "ingest/.env materialized ($(wc -l < ingest/.env) lines)"
          else
            echo "::warning::INGEST_ENV secret not set — supabase fallback unavailable (direct/impersonate still work)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (extractor only — no pipeline install)
        run: pip install requests openpyxl curl_cffi

      - name: Extract LCA rows (all companies, one run)
        # S12 multi-company: ONE dispatch extracts every company's
        # filings — a single download of each quarterly xlsx serves all
        # employer filters (the files are per-QUARTER, not per-company).
        # S14 runs #7/#8 post-mortem: 9 per-employer invocations each
        # re-downloaded AND re-parsed every quarterly xlsx (~100 min,
        # cancelled past every timeout). --multi = single-pass: ONE
        # download (disk-cached) + ONE streaming parse per quarter,
        # every employer filter applied in the same pass (~20 min).
        run: |
          set -e
          if [ -n "${{ inputs.quarters }}" ]; then
            Q="--quarters ${{ inputs.quarters }}"
          else
            Q="--recent ${{ inputs.recent }}"
          fi
          python3 scripts/h1b_extract.py $Q --transport auto --multi             "nvidia_us_fulltime:NVIDIA;netflix_us_fulltime:NETFLIX;tencent_us_fulltime:TENCENT;jd_us_fulltime:JD.COM,JD AMERICAN,JINGDONG;openai_us_fulltime:OPENAI,OPENAI LLC;anthropic_us_fulltime:ANTHROPIC,ANTHROPIC PBC;bytedance_us_fulltime:BYTEDANCE,TIKTOK;alibaba_us_fulltime:ALIBABA;tripcom_us_fulltime:TRIP.COM,CTRIP;baidu_us_fulltime:BAIDU;byd_us_fulltime:BYD;neteasegames_us_fulltime:NETEASE;shein_us_fulltime:SHEIN,ROADGET;gea_us_fulltime:GE APPLIANCES,GE APPLIANCES A HAIER COMPANY,HAIER AMERICA;xpeng_us_fulltime:XPENG;faradayfuture_us_fulltime:FARADAY FUTURE;didi_us_fulltime:DIDI,DIDI LABS,DIDI RESEARCH;tcl_us_fulltime:TCL NORTH AMERICA,TCL AMERICAS;gotion_us_fulltime:GOTION;moonshot_us_fulltime:MOONSHOT AI;weride_us_fulltime:WERIDE,WERIDE AI;tplink_us_fulltime:TP-LINK,TP-LINK SYSTEMS,TP LINK NORTH AMERICA;pony_us_fulltime:PONY.AI,PONY AI,PONYA;minimax_us_fulltime:MINIMAX,MINIMAX AI;shengshu_us_fulltime:SHENGSHU,SHENGSHU TECHNOLOGY;horizon_us_fulltime:HORIZON ROBOTICS,HORIZON ROBOTICS USA;xiaohongshu_us_fulltime:XIAOHONGSHU,REDNOTE;hoyoverse_us_fulltime:COGNOSPHERE;plusai_us_fulltime:PLUSAI;unitedimaging_us_fulltime:UNITED IMAGING HEALTHCARE NORTH AMERICA;genscript_us_fulltime:GENSCRIPT;legendbiotech_us_fulltime:LEGEND BIOTECH;nio_us_fulltime:NIO USA;foxit_us_fulltime:FOXIT;poizon_us_fulltime:POIZON;fuyao_us_fulltime:FUYAO GLASS AMERICA,FUYAO;sanhua_us_fulltime:SANHUA,SANHUA INTERNATIONAL;foxconnfii_us_fulltime:FOXCONN ASSEMBLY,FOXCONN INDUSTRIAL INTERNET;lenovo_us_fulltime:LENOVO,LENOVO GROUP;;cainiao_us_fulltime:CAINIAO;webull_us_fulltime:WEBULL,WEBULL FINANCIAL;popmart_us_fulltime:POP MART AMERICAS,POP MART;beone_us_fulltime:BEONE MEDICINES USA,BEONE MEDICINES US MANUFACTURING,BEIGENE;chagee_us_fulltime:CHAGEE;sungrow_us_fulltime:SUNGROW USA,SUNGROW;deeproute_us_fulltime:DEEPROUTE;agora_us_fulltime:AGORA LAB;bitdeer_us_fulltime:BITDEER;haidilao_us_fulltime:HAIDILAO;omnivision_us_fulltime:OMNIVISION TECHNOLOGIES,OMNIVISION;mattson_us_fulltime:MATTSON TECHNOLOGY;virtuos_us_fulltime:VIRTUOS NORTH AMERICA;joyson_us_fulltime:JOYSON SAFETY SYSTEMS;cofco_us_fulltime:COFCO INTERNATIONAL;meyer_us_fulltime:MEYER CORP,MEYER MANUFACTURING;amersports_us_fulltime:AMER SPORTS,WILSON SPORTING GOODS;trina_us_fulltime:TRINA SOLAR;hisense_us_fulltime:HISENSE USA;wuxibio_us_fulltime:WUXI BIOLOGICS;wuxiapptec_us_fulltime:WUXI APPTEC,XENOBIOTIC LABORATORIES;antintl_us_fulltime:ANT INTERNATIONAL,ANT GROUP;tti_us_fulltime:TECHTRONIC,TECHTRONIC CORDLESS;greenland_us_fulltime:GREENLAND USA,GREENLAND GROUP;niu_us_fulltime:NIU POWER;ascentage_us_fulltime:ASCENTAGE PHARMA;jereh_us_fulltime:AMERICAN JEREH,JEREH;autel_us_fulltime:AUTEL US,AUTEL ENERGY;aden_us_fulltime:AKILA;mandarinoriental_us_fulltime:MANDARIN ORIENTAL,MOHG NEW YORK"

      - name: Checkpoint extract to git (race-proof)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/extract_state
          cp ingest/data/workday/*.h1b_lca.jsonl /tmp/extract_state/ 2>/dev/null || true
          git config user.name "h1b-extract-bot"
          git config user.email "actions@github.com"
          push_ok=0
          for i in 1 2 3; do
            git fetch origin || true
            git reset --hard origin/main
            cp /tmp/extract_state/*.h1b_lca.jsonl ingest/data/workday/ 2>/dev/null || true
            git add ingest/data/workday
            if git diff --cached --quiet; then
              echo "no extract change to commit"
              push_ok=1
              break
            fi
            ROWS=$(python3 -c "import pathlib; print(sum(1 for p in pathlib.Path('ingest/data/workday').glob('*.h1b_lca.jsonl') for l in p.read_text(encoding='utf-8').splitlines() if l.strip().startswith('{')))" 2>/dev/null || echo 0)
            git commit -m "h1b-lca extract checkpoint: ${ROWS} rows total across companies [skip ci]"
            if git push; then push_ok=1; break; fi
            echo "push attempt $i failed — refetching and retrying"
            sleep 5
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::push failed after 3 attempts — extract rescued in /tmp; re-dispatch"
            exit 1
          fi

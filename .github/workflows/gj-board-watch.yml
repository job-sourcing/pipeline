name: GJ Board Watch (weekly)

# S33 (D-S33-1): the Google-Jobs gap-filler boards (custom:gjobs:*,
# tags=["gj"]) — companies whose postings live ONLY on niche
# aggregators (zero LinkedIn-guest cards + no own board; the S32 RCA).
# ONE firecrawl credit per company-RUN buys the whole board (cards +
# full JD inline; detail enrichment is a cache hit — see
# GoogleJobsAdapter). Weekly cadence = 4 credits/week for the live
# four; the dormant probes (gj_dormant) run MONTHLY in the other lane.
# Firecrawl credits are the budgeted resource (~460 balance at S33
# open; ~9 cr/wk total incl. the CF lane ≈ 1 year runway).
# The main daily watch skips these via WATCH_SKIP_TAGS.
on:
  schedule:
    - cron: "25 10 * * 3"    # Wednesdays 10:25Z — off-peak odd minute
  workflow_dispatch:
    inputs:
      watch_details_max:
        description: "max detail enrichments per leg (default 60)"
        required: false
        default: '60'
      watch_budget_seconds:
        description: "wall-clock budget (default 480)"
        required: false
        default: '480'

permissions:
  contents: write
  actions: write

concurrency:
  group: gj-board-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ingest/ curl_cffi
      - name: Materialize runtime env
        env:
          INGEST_ENV: ${{ secrets.INGEST_ENV }}
        run: |
          if [ -n "$INGEST_ENV" ]; then
            printf '%s\n' "$INGEST_ENV" > ingest/.env
          fi
      - name: Run GJ-board watch (gj tag only)
        env:
          WATCH_ONLY_TAGS: gj
          WATCH_DETAILS_MAX: ${{ github.event.inputs.watch_details_max || '60' }}
          WATCH_BUDGET_SECONDS: ${{ github.event.inputs.watch_budget_seconds || '480' }}
        run: python3 scripts/gha_board_watch.py
      - name: Result gates (fail-loudly)
        if: always()
        run: |
          if [ "${WATCH_RESULT}" = "failed" ]; then
            echo "::error::gj-board-watch FAILED"
            exit 1
          fi
      - name: Checkpoint state to git (race-proof)
        if: always()
        run: |
          set -e
          # S32 race fix: checkpoint ONLY the files THIS run touched
          # (git diff of the worktree) — a lane that SKIPPED boards
          # (tag filter) must not overwrite a concurrent lane's newer
          # state for those boards with its stale checkout version.
          mkdir -p /tmp/watch_state
          FILES=$(git status --porcelain ingest/data/board_watch/ \
            | awk '{print $2}' | grep -E '\.(state\.jsonl|newposts\.jsonl|alerts\.log|legs\.json|reposts\.jsonl|runs\.jsonl)$' || true)
          echo "checkpointing: ${FILES:-<none>}"
          for f in $FILES; do
            mkdir -p "/tmp/watch_state/$(dirname $f)"
            cp "$f" "/tmp/watch_state/$f" 2>/dev/null || true
          done
          git config user.name "board-watch-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3; do
            git fetch origin || true
            git reset --hard origin/main
            for f in $FILES; do
              cp "/tmp/watch_state/$f" "$f" 2>/dev/null || true
            done
            git add ingest/data/board_watch
            if git diff --cached --quiet; then
              echo "no state change to commit"; break
            fi
            git commit -m "gj-board-watch checkpoint [skip ci]" || true
            if git push origin main; then push_ok=1; break; fi
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::push failed after 3 attempts — state rescued in /tmp"
            exit 1
          fi

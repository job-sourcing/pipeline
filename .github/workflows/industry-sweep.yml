name: Industry Sweep

# S41 stress test #2 (DESIGN-S41 v2 §3) + S42 v2: the industry×region
# sweep — home services / construction, non-licensed corp/office roles.
# v2 (S42-R1): the us geo mode (local + remote, ALL-US-WIDE — the
# user's "coverage is low, find more robust ways" push), honest-channel
# roster (PM-hardcoded feeds declared skipped:pm-hardcoded; the
# measured-block channels attempt-and-record), --budget-seconds guard
# (outputs ALWAYS written — the F4 green-zero kill), staffing-brand
# split + multi-branch rollup (×N locations), per-source raw/kept
# counters + the WHERE histogram.
#
# Artifacts: ingest/data/industry/<slug>.json + .report.md per matrix
# slug — the S35 rule honored: the mirror back-sync handler is
# dir-wide (new slugs flow automatically) + the !gitignore exception.
# Cadence: weekly Friday 14:15Z runs BOTH slugs (matrix); dispatch
# ?industry=<slug> runs one.

on:
  workflow_dispatch:
    inputs:
      industry:
        description: "INDUSTRIES registry slug (empty = matrix ba+us)"
        default: ""
  schedule:
    - cron: "15 14 * * 5"    # Fridays 14:15Z

permissions:
  contents: write
  actions: write

concurrency:
  group: industry-sweep
  cancel-in-progress: false

jobs:
  sweep:
    strategy:
      matrix:
        include:
          - slug: home_services_ba
            budget: 2400
            timeout: 45
          - slug: home_services_us
            budget: 3000
            timeout: 90
          - slug: genai_media
            budget: 3000
            timeout: 90
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize ingest/.env from secret (S47 fleet wiring)
        # The firecrawl KEY FLEET lives in INGEST_ENV (vault blob
        # carries FIRECRAWL_KEYS since 2026-10-24); single-secret lanes
        # were fleet-blind — gj/builtin/usajobs/zip/glassdoor dark at a
        # dead key[0] while 3 funded keys idle (S47-A1/A2-1 audit).
        env:
          INGEST_ENV: ${{ secrets.INGEST_ENV }}
        run: |
          if [ -n "$INGEST_ENV" ]; then
            printf '%s\n' "$INGEST_ENV" > ingest/.env
            echo "ingest/.env materialized ($(wc -l < ingest/.env) lines)"
          else
            echo "::warning::INGEST_ENV secret not set — running with the per-secret env fallback"
          fi


      - name: Install pipeline + jobspy extra
        run: pip install -e "ingest[jobspy]" curl_cffi

      - name: Run industry sweep
        # schedule runs both slugs; a dispatch input runs only it
        if: >-
          github.event_name == 'schedule' ||
          (github.event.inputs.industry != '' &&
           github.event.inputs.industry == matrix.slug)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          CAREERJET_REFERER: ${{ secrets.CAREERJET_REFERER }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
        run: |
          python3 scripts/industry_sweep.py \
            --industry "${{ matrix.slug }}" \
            --budget-seconds "${{ matrix.budget }}"

      - name: Checkpoint artifacts to git (race-proof, S35 rule)
        if: always()
        run: |
          set -e
          SLUG="${{ matrix.slug }}"
          mkdir -p /tmp/ind_state/ingest/data/industry
          for f in "ingest/data/industry/${SLUG}.json" "ingest/data/industry/${SLUG}.report.md"; do
            if [ -e "$f" ]; then cp "$f" "/tmp/ind_state/$f"; fi
          done
          git config user.name "industry-sweep-bot"
          git config user.email "actions@github.com"
          push_ok=0
          for i in 1 2 3; do
            git fetch origin || true
            git reset --hard origin/main
            for f in "ingest/data/industry/${SLUG}.json" "ingest/data/industry/${SLUG}.report.md"; do
              if [ -e "/tmp/ind_state/$f" ]; then cp "/tmp/ind_state/$f" "$f"; fi
            done
            # F7 lesson: existence-guarded add — a pathspec for a
            # file that legitimately does not exist on run 1 exits 128
            # under set -e and kills the checkpoint
            for f in "ingest/data/industry/${SLUG}.json" "ingest/data/industry/${SLUG}.report.md"; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then push_ok=1; break; fi
            git commit -m "industry-sweep checkpoint (${SLUG}) [skip ci]"
            if git push; then push_ok=1; break; fi
            sleep 5
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::industry-sweep checkpoint push failed after 3 attempts — artifacts rescued in /tmp"
            exit 1
          fi
